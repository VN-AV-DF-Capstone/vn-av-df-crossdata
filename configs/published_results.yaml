    - {method: "MRDF (pre-trained)", train: "original", in_domain: 0.46, open_model: 0.52, open_language: 0.41, open_full: 0.49}
    - {method: "TALL (pre-trained)", train: "original", in_domain: 0.48, open_model: 0.51, open_language: 0.47, open_full: 0.49}
    - {method: "AVFF (fine-tuned)", train: "MAVOS-DD", in_domain: 0.95, open_model: 0.89, open_language: 0.90, open_full: 0.89}
    - {method: "MRDF (fine-tuned)", train: "MAVOS-DD", in_domain: 0.90, open_model: 0.88, open_language: 0.88, open_full: 0.86}
    - {method: "TALL (fine-tuned)", train: "MAVOS-DD", in_domain: 0.86, open_model: 0.84, open_language: 0.80, open_full: 0.79}

