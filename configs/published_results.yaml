# Numbers reported by the original papers. They are context only: protocols, test subsets and
# preprocessing differ from ours, so the report keeps them in a separate table and never ranks
# them against our zero-shot numbers. Every value is copied verbatim from the cited table.

- key: avh_align_table2
  source: "Smeu et al., Circumventing shortcuts in audio-visual deepfake detection datasets with unsupervised learning, CVPR 2025 (arXiv 2412.00175v3), Table 2"
  metric: "AUC (%)"
  protocol: "FakeAVCeleb: 30% test split. AV-Deepfake1M: 10k samples of the validation split. trim = leading silence removed (tau = 5e-4)."
  columns: [fakeavceleb, fakeavceleb_trim, avdeepfake1m, avdeepfake1m_trim]
  rows:
    - {method: "AVH-Align/sup", train: "FakeAVCeleb", fakeavceleb: 99.2, fakeavceleb_trim: 99.2, avdeepfake1m: 69.0, avdeepfake1m_trim: 63.6}
    - {method: "AVH-Align/sup", train: "AV-Deepfake1M", fakeavceleb: 77.5, fakeavceleb_trim: 70.8, avdeepfake1m: 100.0, avdeepfake1m_trim: 83.1}
    - {method: "AVAD", train: "LRS (unsupervised)", fakeavceleb: 84.5, fakeavceleb_trim: 84.7, avdeepfake1m: 54.3, avdeepfake1m_trim: 54.3}
    - {method: "SpeechForensics", train: "VoxCeleb2 (unsupervised)", fakeavceleb: 98.8, fakeavceleb_trim: 98.8, avdeepfake1m: 68.8, avdeepfake1m_trim: 68.2}
    - {method: "AVH-Align", train: "VoxCeleb2 (unsupervised)", fakeavceleb: 94.6, fakeavceleb_trim: 94.6, avdeepfake1m: 85.9, avdeepfake1m_trim: 83.5}

- key: avh_align_table1
  source: "Smeu et al., CVPR 2025 (arXiv 2412.00175v3), Table 1"
  metric: "AUC (%)"
  protocol: "RVRA vs FVFA subsets of FakeAVCeleb; AV-Deepfake1M. Shows the leading-silence shortcut."
  columns: [fakeavceleb, fakeavceleb_trim, avdeepfake1m, avdeepfake1m_trim]
  rows:
    - {method: "Silence classifier", train: "per dataset", fakeavceleb: 98.4, fakeavceleb_trim: 54.8, avdeepfake1m: 98.2, avdeepfake1m_trim: 50.6}

- key: mavosdd_table3
